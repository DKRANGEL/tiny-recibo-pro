<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Magic Fireworks</title>
    <link rel="icon" type="image/jpeg" href="/public/MagicFireworksLogo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/public/css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="/public/js/alerts.js?v=20260729"></script>
    <style>
        body {
            overflow: auto;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        .page-header .brand-sub {
            font-size: 11px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-primary {
            background: #fff;
            border: none;
            color: #000;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background: #d4d4d4;
        }

        .btn-back {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-back:hover {
            border-color: #555;
            color: #fff;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            transition: 0.15s;
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.08);
            color: #999;
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .btn-delete {
            background: rgba(255, 255, 255, 0.04);
            color: #666;
        }

        .btn-delete:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            padding: 10px 20px;
            font-size: 13px;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            height: 42px;
            background: #1a1a1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 0 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box:focus {
            border-color: #666;
        }

        .filter-select {
            height: 42px;
            background: #1a1a1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 0 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
            min-width: 180px;
        }

        .stats {
            font-size: 12px;
            color: #666;
            margin-left: auto;
        }

        .equip-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
        }

        .equip-table thead th {
            background: #1a1a1e;
            color: #666;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid #29292e;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .equip-table tbody td {
            padding: 8px 14px;
            border-bottom: 1px solid #29292e;
            vertical-align: middle;
            height: 52px;
        }

        .equip-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .td-sku {
            font-family: var(--mono);
            font-weight: 700;
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
        }

        .td-nome {
            color: #ccc;
            font-weight: 500;
        }

        .td-preco {
            font-family: var(--mono);
            font-weight: 600;
            text-align: right;
            color: #ccc;
        }

        .td-un {
            font-family: var(--mono);
            text-align: center;
            color: #666;
        }

        .td-obs {
            color: #555;
            font-size: 11px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .td-actions {
            text-align: right;
            white-space: nowrap;
            vertical-align: middle;
        }

        .td-actions-inner {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            align-items: center;
        }

        .cat-row td {
            background: rgba(255, 255, 255, 0.04);
            font-weight: 700;
            font-size: 12px;
            color: #999;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 8px 14px;
            border-bottom: 1px solid #29292e;
        }

        .cat-count {
            font-weight: 400;
            color: #555;
            font-size: 11px;
            text-transform: none;
            letter-spacing: 0;
            margin-left: 8px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #121214;
            border: 1px solid #29292e;
            border-radius: 10px;
            padding: 30px;
            width: 500px;
            max-width: 90vw;
        }

        .modal h2 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 20px;
        }

        .modal-field {
            margin-bottom: 16px;
        }

        .modal-field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .modal-input {
            width: 100%;
            height: 42px;
            background: #1a1a1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 0 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .modal-input:focus {
            border-color: #666;
        }

        .modal-row {
            display: flex;
            gap: 12px;
        }

        .modal-row .modal-field {
            flex: 1;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .empty-msg {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .cat-rename-btn {
            background: transparent; border: none; color: #444; cursor: pointer;
            padding: 2px 6px; border-radius: 4px; font-size: 12px;
            transition: 0.15s; margin-left: 6px; vertical-align: middle;
        }
        .cat-rename-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        #tabelaContainer {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 768px) {
            .page-container {
                padding: 20px 16px 40px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                margin-bottom: 20px;
            }

            .page-header h1 {
                font-size: 20px;
            }

            .header-actions {
                width: 100%;
                flex-wrap: wrap;
                gap: 8px;
            }

            .header-actions .btn-back,
            .header-actions .btn-primary {
                flex: 1;
                text-align: center;
                justify-content: center;
                min-width: 0;
            }

            .filter-select {
                min-width: 0;
                width: 100%;
            }

            .search-box {
                min-width: 0;
            }

            .modal-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
<div class="page-container">
    <div class="page-header">
        <div>
            <h1>📦 Cadastro de Produtos</h1>
            <span class="brand-sub">Magic Fireworks — Catálogo</span>
        </div>
        <div class="header-actions">
            <a href="/" class="btn-back">← Voltar</a>
            <button class="btn-primary" onclick="abrirModalNovo()">+ Novo Produto</button>
        </div>
    </div>

    <div class="toolbar">
        <input type="text" class="search-box" id="searchBox" placeholder="Buscar por nome, código ou categoria..."
               oninput="filtrar()">
        <select class="filter-select" id="filterCategoria" onchange="filtrar()">
            <option value="">Todas as categorias</option>
        </select>
        <div class="stats" id="stats"></div>
    </div>

    <div id="tabelaContainer"></div>

    <div class="modal-overlay" id="modalNovo">
        <div class="modal">
            <h2 id="modalTitulo">Novo Produto</h2>
            <input type="hidden" id="modalEditId" value="">
            <div class="modal-field">
                <label>Código</label>
                <input type="text" class="modal-input" id="modalCodigo" placeholder="Ex: MFSS-006"
                       style="font-family: var(--mono);">
            </div>
            <div class="modal-field">
                <label>Categoria</label>
                <select class="modal-input" id="modalCategoria" onchange="onCategoriaSelectChange()"></select>
                <input type="text" class="modal-input" id="modalCategoriaNova" placeholder="Nome da nova categoria"
                       style="display:none; margin-top:6px;">
            </div>
            <div class="modal-field">
                <label>Nome</label>
                <input type="text" class="modal-input" id="modalNome" placeholder="Ex: Monotiro Dourado">
            </div>
            <div class="modal-row">
                <div class="modal-field">
                    <label>Preço (R$)</label>
                    <input type="number" class="modal-input" id="modalPreco" value="0" min="0" step="0.01">
                </div>
                <div class="modal-field">
                    <label>Unidade</label>
                    <input type="text" class="modal-input" id="modalUnidade" value="UN">
                </div>
                <div class="modal-field">
                    <label>Itens por caixa</label>
                    <input type="number" class="modal-input" id="modalFator" value="1" min="1" step="1"
                           title="Quantas unidades/galões vêm em cada caixa (ex.: Silver Jet = 32, Isopar = 4)">
                </div>
            </div>
            <div class="modal-field">
                <label>Observações</label>
                <input type="text" class="modal-input" id="modalObs" placeholder="Opcional...">
            </div>
            <div class="modal-actions">
                <button class="btn-sm btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-primary" onclick="salvarProduto()">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script>
    let todosProdutos = [];
    let categorias = [];

    document.addEventListener('DOMContentLoaded', () => {
        carregarDados();
    });

    async function carregarDados() {
        try {
            const res = await fetch('/api/catalogo/catalogo');
            const json = await res.json();
            if (!json.success) throw new Error(json.error);

            todosProdutos = [];
            categorias = Object.keys(json.data).sort();
            categorias.forEach(cat => json.data[cat].forEach(p => todosProdutos.push(p)));

            const sel = document.getElementById('filterCategoria');
            sel.innerHTML = '<option value="">Todas as categorias</option>' +
                categorias.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

            filtrar();
        } catch (err) {
            document.getElementById('tabelaContainer').innerHTML = `<div class="empty-msg">Erro: ${err.message}</div>`;
        }
    }

    // Recarrega dados preservando filtro e busca atuais
    async function recarregarProdutos() {
        try {
            const categoriaAtual = document.getElementById('filterCategoria').value;
            const buscaAtual = document.getElementById('searchBox').value;

            const res = await fetch('/api/catalogo/catalogo');
            const json = await res.json();
            if (!json.success) throw new Error(json.error);

            todosProdutos = [];
            categorias = Object.keys(json.data).sort();
            categorias.forEach(cat => json.data[cat].forEach(p => todosProdutos.push(p)));

            const sel = document.getElementById('filterCategoria');
            sel.innerHTML = '<option value="">Todas as categorias</option>' +
                categorias.map(c => `<option value="${esc(c)}" ${c === categoriaAtual ? 'selected' : ''}>${esc(c)}</option>`).join('');

            document.getElementById('searchBox').value = buscaAtual;
            filtrar();
        } catch (err) {
            console.error('Erro ao recarregar:', err);
        }
    }

    function filtrar() {
        const q = document.getElementById('searchBox').value.toLowerCase().trim();
        const cat = document.getElementById('filterCategoria').value;
        let lista = todosProdutos;
        if (q) {
            lista = lista.filter(p =>
                (p.nome || '').toLowerCase().includes(q) ||
                (p.codigo || '').toLowerCase().includes(q) ||
                (p.categoria || '').toLowerCase().includes(q));
        }
        if (cat) lista = lista.filter(p => p.categoria === cat);
        renderTabela(lista);
    }

    function renderTabela(lista) {
        const container = document.getElementById('tabelaContainer');
        document.getElementById('stats').textContent = `${lista.length} produtos • ${categorias.length} categorias`;

        if (lista.length === 0) {
            container.innerHTML = '<div class="empty-msg">Nenhum produto encontrado. Use "+ Novo Produto" para cadastrar.</div>';
            return;
        }

        const agrupado = {};
        lista.forEach(p => {
            const cat = p.categoria || 'Sem categoria';
            if (!agrupado[cat]) agrupado[cat] = [];
            agrupado[cat].push(p);
        });

        let html = `<table class="equip-table"><thead><tr>
        <th style="width:50px;text-align:center;">IMG</th>
        <th style="width:110px;">CÓDIGO</th>
        <th>NOME</th>
        <th style="width:100px;text-align:right;">PREÇO</th>
        <th style="width:50px;text-align:center;">UN</th>
        <th style="width:180px;">OBS</th>
        <th style="width:110px;text-align:right;">AÇÕES</th>
    </tr></thead><tbody>`;

        Object.keys(agrupado).sort().forEach(cat => {
            const itens = agrupado[cat];
            html += `<tr class="cat-row"><td colspan="7">
                ${esc(cat)}<span class="cat-count">${itens.length} produtos</span>
                <button class="cat-rename-btn" onclick="renomearCategoria('${esc(cat)}')" title="Renomear categoria">
                    <i data-lucide="pencil"></i>
                </button>
                <button class="cat-rename-btn" onclick="excluirCategoria('${esc(cat)}')" title="Excluir categoria">
                    <i data-lucide="trash-2"></i>
                </button>
            </td></tr>`;

            itens.forEach(p => {
                // cache-bust por versão: muda apenas quando a imagem é trocada
                const v = p.imagem_v || 1;
                const imgTag = p.imagem
                    ? `<img src="/data/produtos/${esc(p.imagem)}?v=${v}" style="width:36px;height:36px;object-fit:contain;border-radius:4px;background:#1a1a1e;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div style="width:36px;height:36px;background:#1a1a1e;border-radius:4px;border:1px dashed #555;display:none;align-items:center;justify-content:center;color:#555;font-size:10px;">?</div>`
                    : `<div style="width:36px;height:36px;background:#1a1a1e;border-radius:4px;border:1px dashed #333;display:flex;align-items:center;justify-content:center;color:#444;"><i data-lucide="image"></i></div>`;

                html += `<tr>
                <td style="text-align:center;padding:6px;">
                    <label style="cursor:pointer;" title="Trocar imagem">
                        ${imgTag}
                        <input type="file" accept="image/*" style="display:none;"
                            data-id="${p.id}" onchange="uploadImagem(this)">
                    </label>
                </td>
                <td class="td-sku">${esc(p.codigo)}</td>
                <td class="td-nome">${esc(p.nome)}</td>
                <td class="td-preco">${fmtPreco(p.preco)}</td>
                <td class="td-un">${esc(p.unidade || 'UN')}${(p.fator && p.fator > 1) ? ` · ${p.fator}/cx` : ''}</td>
                <td class="td-obs" title="${esc(p.observacoes || '')}">${esc(p.observacoes || '-')}</td>
                <td class="td-actions">
                    <div class="td-actions-inner">
                        <button class="btn-sm btn-edit" onclick="editarProduto(${p.id})"><i data-lucide="pencil"></i></button>
                        <button class="btn-sm btn-delete" onclick="deletarProduto(${p.id},'${esc(p.nome).replace(/'/g,'\\'+'\'')}')" title="Excluir"><i data-lucide="trash-2"></i></button>
                        ${p.imagem ? `<button class="btn-sm btn-delete" onclick="removerImagem(${p.id})" title="Remover imagem"><i data-lucide="image-off"></i></button>` : ''}
                    </div>
                </td>
            </tr>`;
            });
        });

        html += '</tbody></table>';
        container.innerHTML = html;
        lucide.createIcons();
    }

    function fmtPreco(v) {
        return 'R$ ' + (parseFloat(v) || 0).toLocaleString('pt-BR', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function esc(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function abrirModalNovo() {
        document.getElementById('modalTitulo').textContent = 'Novo Produto';
        document.getElementById('modalEditId').value = '';
        document.getElementById('modalCodigo').value = '';
        document.getElementById('modalNome').value = '';
        document.getElementById('modalPreco').value = '0';
        document.getElementById('modalUnidade').value = 'UN';
        document.getElementById('modalFator').value = '1';
        document.getElementById('modalObs').value = '';
        preencherSelectCategoria(document.getElementById('filterCategoria').value || '');
        document.getElementById('modalNovo').classList.add('active');
        document.getElementById('modalCodigo').focus();
    }

    function editarProduto(id) {
        const p = todosProdutos.find(x => x.id == id);
        if (!p) return;
        document.getElementById('modalTitulo').textContent = 'Editar Produto';
        document.getElementById('modalEditId').value = id;
        document.getElementById('modalCodigo').value = p.codigo || '';
        document.getElementById('modalNome').value = p.nome || '';
        document.getElementById('modalPreco').value = p.preco || 0;
        document.getElementById('modalUnidade').value = p.unidade || 'UN';
        document.getElementById('modalFator').value = p.fator || 1;
        document.getElementById('modalObs').value = p.observacoes || '';
        preencherSelectCategoria(p.categoria || '');
        document.getElementById('modalNovo').classList.add('active');
        document.getElementById('modalNome').focus();
    }

    function fecharModal() {
        document.getElementById('modalNovo').classList.remove('active');
    }

    async function salvarProduto() {
        const editId = document.getElementById('modalEditId').value;
        const dados = {
            codigo: document.getElementById('modalCodigo').value.trim(),
            nome: document.getElementById('modalNome').value.trim(),
            preco: document.getElementById('modalPreco').value,
            unidade: document.getElementById('modalUnidade').value.trim() || 'UN',
            fator: Math.max(1, parseInt(document.getElementById('modalFator').value) || 1),
            categoria: categoriaEscolhida(),
            observacoes: document.getElementById('modalObs').value.trim()
        };
        if (dados.categoria === null) {
            MF.alert('Escolha ou digite uma categoria', 'warning', 'Campo obrigatório');
            return;
        }
        if (!dados.nome) {
            MF.alert('Preencha o nome', 'warning', 'Campo obrigatório');
            return;
        }
        if (!dados.codigo) {
            MF.alert('Preencha o código', 'warning', 'Campo obrigatório');
            return;
        }

        try {
            const url = editId ? `/api/catalogo/item/${editId}` : '/api/catalogo/item';
            const res = await fetch(url, {
                method: editId ? 'PUT' : 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            fecharModal();
            recarregarProdutos();
        } catch (err) {
            MF.alert(err.message);
        }
    }

    async function deletarProduto(id, nome) {
        const _ok = await MF.confirm(`Remover "${nome}" do catálogo?`, { title: 'Remover produto', confirmText: 'Remover', danger: true });
        if (!_ok) return;
        try {
            const res = await fetch(`/api/catalogo/item/${id}`, {method: 'DELETE'});
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            recarregarProdutos();
        } catch (err) {
            MF.alert(err.message);
        }
    }

    async function uploadImagem(input) {
        const id = input.dataset.id;
        if (!input.files[0]) return;

        // Feedback visual: mostra spinner na célula da imagem
        const label = input.closest('label');
        const originalContent = label ? label.innerHTML : '';
        if (label) label.innerHTML = '<div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#666;font-size:18px;">⏳</div>';

        const form = new FormData();
        form.append('imagem', input.files[0]);
        try {
            const res = await fetch(`/api/catalogo/item/${id}/imagem`, {method: 'PUT', body: form});
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            recarregarProdutos();
        } catch (err) {
            if (label) label.innerHTML = originalContent;
            MF.alert(err.message);
        }
    }

    async function removerImagem(id) {
        const _ok = await MF.confirm('Remover imagem deste produto?', { title: 'Remover imagem', confirmText: 'Remover', danger: true });
        if (!_ok) return;
        try {
            const res = await fetch(`/api/catalogo/item/${id}/imagem`, {method: 'DELETE'});
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            recarregarProdutos();
        } catch (err) {
            MF.alert(err.message);
        }
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') fecharModal();
    });

    // ── RENOMEAR CATEGORIA ──
    // Popula o select de categoria do modal (categorias existentes + criar nova)
    function preencherSelectCategoria(atual) {
        const sel = document.getElementById('modalCategoria');
        const cats = categorias.slice();
        if (atual && !cats.includes(atual)) cats.unshift(atual);
        sel.innerHTML = cats.map(c => `<option value="${esc(c)}" ${c === atual ? 'selected' : ''}>${esc(c)}</option>`).join('')
            + `<option value="__nova__">➕ Nova categoria...</option>`;
        if (!atual && !cats.length) sel.value = '__nova__';
        const nova = document.getElementById('modalCategoriaNova');
        nova.value = '';
        nova.style.display = sel.value === '__nova__' ? 'block' : 'none';
    }

    function onCategoriaSelectChange() {
        const nova = document.getElementById('modalCategoriaNova');
        const ehNova = document.getElementById('modalCategoria').value === '__nova__';
        nova.style.display = ehNova ? 'block' : 'none';
        if (ehNova) nova.focus();
    }

    // Retorna a categoria escolhida, ou null se "nova" sem nome
    function categoriaEscolhida() {
        const sel = document.getElementById('modalCategoria').value;
        if (sel === '__nova__') {
            const nome = document.getElementById('modalCategoriaNova').value.trim();
            return nome || null;
        }
        return sel;
    }

    async function excluirCategoria(cat) {
        const qtd = todosProdutos.filter(p => (p.categoria || 'Sem categoria') === cat).length;
        const ok = await MF.confirm(
            `Excluir a categoria "${cat}"?\n\n${qtd} produto(s) vão para "Sem categoria" (os produtos NÃO são apagados).`,
            { title: 'Excluir categoria', confirmText: 'Excluir', danger: true }
        );
        if (!ok) return;
        try {
            const res = await fetch(`/api/catalogo/categoria/${encodeURIComponent(cat)}`, { method: 'DELETE' });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            MF.toast(`Categoria excluída. ${json.movidos} produto(s) em "Sem categoria".`);
            carregarDados();
        } catch (err) { MF.alert('Erro: ' + err.message); }
    }

    async function renomearCategoria(categoriaAtual) {
        const nova = await MF.prompt(`Renomear categoria "${categoriaAtual}" para:`, categoriaAtual);
        if (!nova || nova.trim() === categoriaAtual) return;
        try {
            const res = await fetch('/api/catalogo/categoria/renomear', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ categoria_atual: categoriaAtual, categoria_nova: nova.trim() })
            });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            MF.toast(`Categoria renomeada! ${json.atualizados} produto(s) atualizado(s).`);
            carregarDados();
        } catch (err) {
            MF.alert('Erro: ' + err.message);
        }
    }

</script>
